<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>np-spike</title>
<style>
body{background:#000;color:#eee;font:17px -apple-system,sans-serif;padding:24px}
button{font-size:20px;padding:14px 20px;border-radius:12px;border:0;background:#0a84ff;color:#fff}
pre{white-space:pre-wrap;font-size:13px;color:#9f9}
</style>
</head>
<body>
<h2>nearpush Web Push spike</h2>
<p id="mode"></p>
<button id="sub">Enable notifications</button>
<pre id="out"></pre>
<script>
const out = document.getElementById("out");
function say(m) {
  out.textContent += m + "\n";
  fetch("/client-log", { method: "POST", body: m }).catch(() => {});
}
const standalone = window.navigator.standalone === true ||
  matchMedia("(display-mode: standalone)").matches;
document.getElementById("mode").textContent = "standalone: " + standalone;
say("load standalone=" + standalone + " sw=" + ("serviceWorker" in navigator) +
    " push=" + ("PushManager" in window) + " notif=" +
    (window.Notification ? Notification.permission : "none"));

function b64u(s) {
  const p = "=".repeat((4 - s.length % 4) % 4);
  const r = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(r, (c) => c.charCodeAt(0));
}

let reg;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").then((r) => { reg = r; say("sw registered"); })
    .catch((e) => say("sw error " + e));
}

document.getElementById("sub").onclick = async () => {
  try {
    const perm = await Notification.requestPermission();
    say("permission=" + perm);
    if (perm !== "granted") return;
    reg = reg || await navigator.serviceWorker.ready;
    const { key } = await (await fetch("/vapid")).json();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(key) });
    const r = await fetch("/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
    say("subscribed endpoint host=" + new URL(sub.endpoint).host + " server=" + r.status);
  } catch (e) {
    say("subscribe error " + e);
  }
};
</script>
</body>
</html>
