[package]
name = "nearpushd"
description = "Laptop daemon that streams notification events to an iPhone web page over WSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nearpushd"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
nearpush-common = { path = "../nearpush-common" }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
