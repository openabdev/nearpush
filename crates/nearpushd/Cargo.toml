[package]
name = "nearpushd"
description = "Laptop daemon that streams notification events to an iPhone web page over WSS"
version.workspace = true
edition.workspace = true
# web-push-native 0.5 declares MSRV 1.87; the workspace (eventrelay, the CLI) stays on 1.85.
rust-version = "1.87"

[[bin]]
name = "nearpushd"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
nearpush-common = { path = "../nearpush-common" }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Web Push: RFC 8291 payload encryption only; the VAPID JWT is built here with p256.
web-push-native = { version = "0.5", default-features = false }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8", "pem"] }
base64ct = { version = "1", features = ["alloc"] }
http = "1"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
